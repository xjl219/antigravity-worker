name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOYED_WORKER_URL: ${{ secrets.DEPLOYED_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test
        if: ${{ env.DEPLOYED_WORKER_URL != '' }}
        run: |
          set -euo pipefail
          url="${DEPLOYED_WORKER_URL%/}/health"
          echo "Smoke testing ${url}"
          body="$(curl --fail --silent --show-error --max-time 20 "${url}")"
          echo "${body}"
          echo "${body}" | grep -q '"ok":true'
