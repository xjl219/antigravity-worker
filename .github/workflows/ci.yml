name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run types
      - name: TypeScript check
        id: tsc
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/tsc.log
      - name: Publish diagnostics
        if: failure() && steps.tsc.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY="$(cat /tmp/tsc.log | tail -c 12000)"
          gh issue create --title "CI diagnostic ${{ github.sha }}" --body "```text
$BODY
```" --label "bug" || true
      - run: npm test
