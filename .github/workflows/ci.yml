name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run types
      - name: TypeScript check
        id: tsc
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/tsc.log
      - name: Publish diagnostics
        if: failure() && steps.tsc.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp /tmp/tsc.log .ci-tsc.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diagnostics
          git add -f .ci-tsc.log
          git commit -m "ci: capture TypeScript diagnostics" || true
          git push -f origin ci-diagnostics || true
      - run: npm test
